services:
  postgres:
    image: postgres:16-alpine
    container_name: padaria-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: padaria
      POSTGRES_PASSWORD: padaria123
      POSTGRES_DB: padaria_delivery
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: padaria-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    # minio/minio sumiu do Docker Hub (e o quay exige licença); elestio/minio é
    # o build da comunidade. Em produção serve qualquer imagem S3-compatible.
    image: elestio/minio:latest
    container_name: padaria-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: padaria
      MINIO_ROOT_PASSWORD: padaria123
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  redisdata:
  miniodata:
