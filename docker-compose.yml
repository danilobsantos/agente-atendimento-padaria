services:
  postgres:
    image: postgres:16-alpine
    container_name: padaria-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: padaria
      POSTGRES_PASSWORD: padaria123
      POSTGRES_DB: padaria_delivery
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: padaria-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
